name: abg_dispatch
description: "ABG Dispatch — internal document, parcel and asset custody tracking for Anvir Bashundhara Group."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.5
  go_router: ^18.1.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  uuid: ^4.6.0
  signature: ^6.4.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope_800ExtraBold.ttf
          weight: 800
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali_700Bold.ttf
          weight: 700
