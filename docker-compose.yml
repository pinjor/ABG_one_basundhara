services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bsc
      POSTGRES_PASSWORD: bsc_dev_password
      POSTGRES_DB: bsc
    ports:
      - "5432:5432"
    volumes:
      - bsc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bsc_redis_data:/data

volumes:
  bsc_postgres_data:
  bsc_redis_data:
